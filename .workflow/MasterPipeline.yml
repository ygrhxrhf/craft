version: '1.0'
name: master-pipeline
displayName: MasterPipeline
triggers:
  trigger: auto
  push:
    branches:
      include:
        - main
      exclude: []
stages:
  - name: check
    displayName: 类型检查与单元测试
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: node_check
        displayName: Nodejs 构建
        # 官方 Node 插件镜像里的版本偏旧（文档只列到 15.12），而本项目 next 16 要求
        # >=20.9、vitest 4 要求 >=20，所以命令里自己引导一份 Node 20：下面这一项
        # nodeVersion 只当兜底，填下拉里实际存在的最高版本即可，改它不影响构建。
        nodeVersion: 20.19.0
        # 每条 command 各自在独立 shell 里跑，`export PATH` 不会带给下一条，
        # 所以整段用 && 串成一条命令。最后一步的 CI_SKIP_DB_TESTS=1 排掉 27 个
        # 连真 Postgres 的用例（列表在 vitest.config.ts），构建机没有库。
        commands:
          - >-
            set -e &&
            wget -q -O /tmp/node.tgz https://registry.npmmirror.com/-/binary/node/v20.19.0/node-v20.19.0-linux-x64.tar.gz &&
            mkdir -p "$HOME/node20" && tar -xzf /tmp/node.tgz -C "$HOME/node20" --strip-components=1 &&
            export PATH="$HOME/node20/bin:$PATH" &&
            node -v && npm -v &&
            npm config set registry https://registry.npmmirror.com &&
            npm ci --no-audit --no-fund &&
            npx tsc --noEmit &&
            CI_SKIP_DB_TESTS=1 npx vitest run --reporter=dot
        strategy: {}
